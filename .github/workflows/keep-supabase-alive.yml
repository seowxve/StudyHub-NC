name: Keep Supabase awake

on:
  schedule:
    - cron: "17 20 * * *"
    - cron: "43 8 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets are missing. Add SUPABASE_URL and SUPABASE_ANON_KEY under Settings > Secrets and variables > Actions."
            exit 1
          fi

          ok=0
          for table in "resources?select=id,title&limit=5" "subjects?select=id,name"; do
            for attempt in 1 2 3; do
              status=$(curl -s -o response.json -w "%{http_code}" \
                "$SUPABASE_URL/rest/v1/$table" \
                -H "apikey: $SUPABASE_ANON_KEY" \
                -H "Authorization: Bearer $SUPABASE_ANON_KEY")
              echo "$table attempt $attempt: HTTP $status"
              if [ "$status" = "200" ]; then
                cat response.json; echo
                ok=$((ok+1))
                break
              fi
              sleep 30
            done
          done

          if [ "$ok" -eq 0 ]; then
            echo "Supabase did not respond with 200. The project may already be paused."
            exit 1
          fi
